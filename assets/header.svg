<svg xmlns="http://www.w3.org/2000/svg" width="840" height="280" viewBox="0 0 840 280">
<defs>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00BFFF"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
  <clipPath id="round"><rect width="840" height="280" rx="16"/></clipPath>
  <style>
    .fade{animation:fade .5s ease-out both}
    @keyframes fade{from{opacity:0}}
    .grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.4s cubic-bezier(.22,1,.36,1) both}
    @keyframes grow{from{transform:scaleX(0)}}
  </style>
  
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#1E2733"/></pattern>
  <radialGradient id="fade" cx="0.7" cy="0.4" r="0.8"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
  <mask id="dotmask"><rect width="840" height="280" fill="url(#fade)"/></mask>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="50"/></filter>
  <linearGradient id="name" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#9BE3FF"/></linearGradient>
  <style>
    .orb{animation:drift 14s ease-in-out infinite alternate}
    .orb2{animation-duration:18s;animation-direction:alternate-reverse}
    @keyframes drift{from{transform:translate(0,0)}to{transform:translate(-60px,30px)}}
    .float{animation:float 6s ease-in-out infinite}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
    .rot{opacity:0;animation:rot 12s infinite}
    @keyframes rot{0%{opacity:0;transform:translateY(8px)}3%{opacity:1;transform:translateY(0)}22%{opacity:1;transform:translateY(0)}25.00%{opacity:0;transform:translateY(-8px)}100%{opacity:0}}
    .in{animation:in .9s ease-out both}
    @keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .caret{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
  </style>
</defs>
<g clip-path="url(#round)">
  <rect width="840" height="280" fill="#0F141B"/>
  
  <rect width="840" height="280" fill="url(#dots)" mask="url(#dotmask)"/>
  <circle class="orb" cx="700" cy="70" r="130" fill="#00BFFF" opacity="0.35" filter="url(#blur)"/>
  <circle class="orb orb2" cx="560" cy="250" r="110" fill="#8B5CF6" opacity="0.35" filter="url(#blur)"/>

  <g class="in">
    <rect x="48" y="44" width="150" height="28" rx="14" fill="#00BFFF14" stroke="#00BFFF55"/>
    <circle cx="66" cy="58" r="4" fill="#3FB950"><animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/></circle>
    <text x="78" y="62.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#00BFFF">ahmadcodes.de</text>
  </g>
  <text class="in" style="animation-delay:.15s" x="46" y="128" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="50" font-weight="800" letter-spacing="-1" fill="url(#name)">Ahmad Alhalabi</text>
  <text class="in" style="animation-delay:.3s" x="48" y="164" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" fill="#C9D1D9">Software Developer &amp; Digital Designer</text>
  <g class="in" style="animation-delay:.45s">
    <text x="48" y="194" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#8B949E">Fachinformatiker für Anwendungsentwicklung  ·  Aschaffenburg, Germany</text>
  </g>
  <g class="in" style="animation-delay:.6s">
    <text x="48" y="236" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" fill="#00BFFF">&gt;</text>
    <text x="66" y="236" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" fill="#8B949E">building</text>
    <g transform="translate(150 236)"><text class="rot" style="animation-delay:0s" x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" fill="#E6EDF3">Python automation</text><text class="rot" style="animation-delay:3s" x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" fill="#E6EDF3">Discord bots</text><text class="rot" style="animation-delay:6s" x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" fill="#E6EDF3">React &amp; Next.js frontends</text><text class="rot" style="animation-delay:9s" x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" fill="#E6EDF3">Photo &amp; motion design</text></g>
  </g>

  <g class="float" transform-origin="700 140">
    <rect x="610" y="70" width="180" height="140" rx="22" fill="#0D1117CC" stroke="url(#accent)" stroke-width="1.5"/>
    <text x="700" y="140" dy="0.35em" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="54" font-weight="700" fill="url(#accent)">&lt;A/&gt;</text>
  </g>
</g>
<rect x="0.5" y="0.5" width="839" height="279" rx="15.5" fill="none" stroke="#30363D"/>
</svg>
